packages:
  - packages/*

enablePrePostScripts: false

injectWorkspacePackages: true

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd

syncInjectedDepsAfterScripts:
  - build
minimumReleaseAgeExclude:
  # Renovate security update: uuid@13.0.1
  - uuid@13.0.1
