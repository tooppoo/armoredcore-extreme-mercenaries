packages:
  - packages/*

enablePrePostScripts: false

injectWorkspacePackages: true

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd

syncInjectedDepsAfterScripts:
  - build
minimumReleaseAgeExclude:
  # Renovate security update: vite@7.3.2
  - vite@7.3.2
