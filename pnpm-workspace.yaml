packages:
  - packages/*

enablePrePostScripts: false

injectWorkspacePackages: true

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd

syncInjectedDepsAfterScripts:
  - build
minimumReleaseAgeExclude:
  # Renovate security update: vitest@4.1.0
  - vitest@4.1.0
