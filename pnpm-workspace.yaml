packages:
  - packages/*

enablePrePostScripts: false

injectWorkspacePackages: true

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd

syncInjectedDepsAfterScripts:
  - build
minimumReleaseAgeExclude:
  # Renovate security update: zod@4.6.6
  - zod@4.6.6
